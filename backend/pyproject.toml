[tool.ruff]
line-length = 100
# Eng PAST qo'llab-quvvatlanadigan versiya (paketlar minimumi ham shu).
# 3.12 turgan paytda `from datetime import UTC` (3.11+) jimgina o'tib
# ketgandi va xatolik faqat serverda, deploy vaqtida ma'lum bo'ldi.
target-version = "py310"
exclude = ["migrations", "mongo_migrations", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405", "S104", "S105"]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"
