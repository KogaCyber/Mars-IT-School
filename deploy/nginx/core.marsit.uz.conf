# core.marsit.uz — nginx vhost (mars, :8880 orqasida Caddy turadi).
#
# BU NUSXA — MA'LUMOT UCHUN. Amaldagi fayl serverda:
#   /etc/nginx/sites-enabled/core.marsit.uz
# Deploy uni O'ZGARTIRMAYDI: bu vhost gamification frontendi bilan UMUMIY,
# shuning uchun har qanday tuzatish qo'lda va faqat deploy oynasidan tashqarida
# qilinadi (10:00–12:30 va 14:00–18:00 UZT — darslar vaqti).
#
# Tartib: nusxani shu yerda tahrirlash -> serverga qo'yish -> `nginx -t` ->
# `nginx -s reload`. Zaxira: /home/mars/nginx-backups/ (sites-enabled ICHIDA
# EMAS — nginx u papkadagi hamma faylni o'qiydi va dublikat server_name
# paydo bo'lardi).
#
# Oxirgi yangilanish: 2026-09-10.

server{
        server_name core.marsit.uz;
	root /home/mars/thesystem/production_pages;

	# Block source map files
	location ~* \.map$ {
		return 404;
	}

	# Do not cache the SPA entry point so new deploys are picked up immediately
	location = /index.html {
		add_header Cache-Control "no-cache, no-store, must-revalidate" always;
	}

	location / {
        try_files $uri $uri/ /index.html =404;
	}


	# ===================================================================
	# Mars IT School — marketing sayti (core.marsit.uz/school/)
	# Qo'shildi: 2026-09-10. Backend: supervisor `school_api` -> :3530.
	# Django FORCE_SCRIPT_NAME=/school bilan ishlaydi: nginx prefiksni
	# KESIB uzatadi, Django esa uni o'zi yasagan manzillarga qaytadan
	# qo'shadi. Shuning uchun proxy_pass oxiridagi `/` MAJBURIY.
	# ===================================================================

	# Manzil TO'LIQ yoziladi: nginx :8880 da turadi va nisbiy `301 /school/`
	# javobida o'sha ichki portni (`http://core.marsit.uz:8880/school/`) chiqarib
	# yuborardi — brauzer https'dan http'ga tushib, mavjud bo'lmagan portga
	# urinardi. Caddy TLS'ni tashqarida tugatadi, shuning uchun sxema qat'iy https.
	location = /school {
		return 301 https://$host/school/;
	}

	# --- Django: API, admin panel, health, til almashtirgich ------------
	# Bular `/school/` (SPA) dan UZUNROQ prefiks, ya'ni nginx ularni
	# birinchi tanlaydi.
	location /school/api/ {
		proxy_pass http://127.0.0.1:3530/api/;
		proxy_set_header Host $server_name;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_read_timeout 60s;
	}

	location /school/health/ {
		access_log off;
		proxy_pass http://127.0.0.1:3530/health/;
		proxy_set_header Host $server_name;
		proxy_set_header X-Forwarded-Proto https;
	}

	location /school/boshqaruv-8936958c/ {
		proxy_pass http://127.0.0.1:3530/boshqaruv-8936958c/;
		proxy_set_header Host $server_name;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		client_max_body_size 6m;   # rezyume yuklash (ilova cheklovi 5 MB)
		proxy_read_timeout 60s;
	}

	location /school/i18n/ {
		proxy_pass http://127.0.0.1:3530/i18n/;
		proxy_set_header Host $server_name;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
	}

	# --- Django statikasi va yuklangan rasmlar (fayldan, ilovasiz) -----
	location /school/static/ {
		alias /home/mars/mars-it-school/backend/staticfiles/;
		access_log off;
		expires 1y;
		add_header Cache-Control "public, immutable" always;
	}

	location /school/media/ {
		alias /home/mars/mars-it-school/data/media/;
		access_log off;
		expires 30d;
		add_header Cache-Control "public" always;
		# Media — passiv resurs; unda hech qachon aktiv mazmun bo'lmasligi kerak.
		add_header X-Content-Type-Options "nosniff" always;
		add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
	}

	# --- SPA: har bir til uchun oldindan render qilingan HTML ----------
	# `alias` emas, `root`: `alias` + `try_files` juftligida nginx $uri ni
	# ikki marta qo'shib yuboradigan ma'lum nosozlik bor. Shuning uchun
	# fayllar `web/school/` ichida yotadi va oddiy `root` ishlatiladi.
	location /school/ {
		root /home/mars/mars-it-school/web;
		try_files $uri $uri/index.html /school/index.html;

		# Caddy CSP qo'ymaydi, Django esa faqat O'Z javoblariga qo'yadi —
		# statik SPA sahifalari himoyasiz qolardi.
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://server.arcgisonline.com; font-src 'self' data:; connect-src 'self'; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; media-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
		add_header X-Content-Type-Options "nosniff" always;
	}

	# SPA kirish nuqtalari keshlanmasin — yangi deploy darhol ko'rinsin.
	location ~ ^/school/(.*/)?index\.html$ {
		root /home/mars/mars-it-school/web;
		add_header Cache-Control "no-cache, no-store, must-revalidate" always;
	}

	location ~ ^/school/assets/ {
		root /home/mars/mars-it-school/web;
		access_log off;
		expires 1y;
		add_header Cache-Control "public, immutable" always;
	}

	# Kengaytmasi bor so'rov — bu AKTIV (shrift, rasm, css), sahifa emas.
	# Topilmasa 404 berilishi SHART. Aks holda u SPA'ning `index.html` iga
	# tushib, brauzer HTML'ni shrift deb o'qishga urinadi va konsolda
	# "invalid sfntVersion: 1008821359" chiqadi — bu son `<!DO` ning o'zi.
	#
	# `static/` va `media/` chetlab o'tiladi: ular alohida `alias` bilan
	# boshqa papkadan beriladi, bu yerdagi `root` ularga to'g'ri kelmaydi.
	# Namuna `assets/` dan KEYIN turadi — aks holda undagi bir yillik
	# kesh sarlavhalari yo'qolardi.
	location ~ ^/school/(?!static/|media/).+\.(?:woff2?|ttf|otf|eot|css|js|map|png|jpe?g|gif|svg|webp|avif|ico|json|webmanifest|txt|xml|mp4|webm)$ {
		root /home/mars/mars-it-school/web;
		try_files $uri =404;
	}

    listen 8880; # managed by Certbot
}
