; Mars IT School — sayt backend'i (FastAPI / uvicorn).
; Sayt core.marsit.uz ning /school/ yo'lida turadi; nginx prefiksni kesib
; uzatadi, FastAPI `ROOT_PATH=/school` bilan to'liq manzillarni yasaydi.
;
; --proxy-headers + --forwarded-allow-ips: X-Forwarded-Proto/For faqat
; nginx'dan (127.0.0.1) qabul qilinadi — tashqaridan soxtalashtirib bo'lmaydi.
;
; Nusxa: /etc/supervisor/conf.d/school_api.conf
[program:school_api]
directory=/home/mars/mars-it-school/api
command=/home/mars/mars-it-school/api/.venv/bin/uvicorn app.main:app
    --host 127.0.0.1 --port 3530
    --workers 2
    --proxy-headers --forwarded-allow-ips 127.0.0.1
    --timeout-keep-alive 15
    --no-access-log
user=mars
autostart=true
autorestart=true
startsecs=8
stopwaitsecs=20
stdout_logfile=/home/mars/mars-it-school/logs/api.out.log
stderr_logfile=/home/mars/mars-it-school/logs/api.err.log
