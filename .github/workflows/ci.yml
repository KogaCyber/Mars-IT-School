# Har bir push va pull request'da ikkala qismning testlari yuriladi.
#
# Nega kerak: ilgari testlar `.env` dagi production Atlas klasteriga ulanardi va
# 30 ta test 10 daqiqadan ko'proq davom etardi — shuning uchun ularni hech kim
# muntazam yurgizmasdi. Endi baza konteynerda, to'plam bir necha soniyada
# tugaydi va buzilgan kod main'ga tusha olmaydi.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Paketlarni o'rnatish
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Sozlamalar tekshiruvi
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Testlar
        run: pytest -q
        env:
          # `config/settings/test.py` baribir lokal manzilni majburlaydi —
          # bu yerda faqat aniqlik uchun takrorlanadi.
          TEST_MONGODB_URI: mongodb://localhost:27017

      # Production sozlamalari bilan Django'ning o'z xavfsizlik tekshiruvi.
      # Bu qadam `.env` ga bog'liq bo'lmasligi uchun barcha qiymatlar shu
      # yerda beriladi — maqsad kodni tekshirish, sirlarni emas.
      - name: Xavfsizlik tekshiruvi (check --deploy)
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-uchun-uzun-va-tasodifiy-kalit-0123456789abcdefghijklmnop
          ALLOWED_HOSTS: api.example.com
          CORS_ALLOWED_ORIGINS: https://example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          ADMIN_URL: ci-maxfiy-panel/
          MEDIA_ROOT: /tmp/ci-media
          PRIVATE_MEDIA_ROOT: /tmp/ci-private-media
          MONGODB_URI: mongodb://localhost:27017

      # Ma'lum zaifliklari bor paketlar main'ga tushmasligi kerak.
      # Zaiflik bazasi kundan kunga o'zgaradi, ya'ni kod o'zgarmasa ham
      # yangi CVE paydo bo'lishi mumkin — shuning uchun har bir yurishda.
      - name: Paketlardagi zaifliklar (pip-audit)
        run: |
          pip install pip-audit==2.9.0
          pip-audit --requirement requirements.txt --strict

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Paketlardagi zaifliklar (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Testlar
        run: npm test

      - name: Build
        run: npm run build
