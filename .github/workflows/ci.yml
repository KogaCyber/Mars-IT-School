# Har bir push va pull request'da ikkala qismning testlari yuriladi.
#
# Nega kerak: ilgari testlar `.env` dagi masofaviy bazaga ulanardi va
# 30 ta test 10 daqiqadan ko'proq davom etardi — shuning uchun ularni hech kim
# muntazam yurgizmasdi. Endi baza konteynerda, to'plam bir necha soniyada
# tugaydi va buzilgan kod main'ga tusha olmaydi.
name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
  # `deploy.yml` shu to'plamni deploy'dan OLDIN qayta ishlatadi: production
  # uchun alohida, nusxa ko'chirilgan tekshiruvlar ro'yxati bo'lmasin.
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # Eng PAST va eng yuqori versiya — ikkalasida ham yurishi shart
    # (serverda 3.10 turibdi).
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mars_it_school
          POSTGRES_PASSWORD: mars_it_school
          POSTGRES_DB: mars_it_school
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mars_it_school"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: Paketlarni o'rnatish
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Migratsiyalar bo'sh bazaga yotadi va model bilan mos
        run: |
          alembic upgrade head
          alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://mars_it_school:mars_it_school@localhost:5432/mars_it_school

      - name: Testlar
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://mars_it_school:mars_it_school@localhost:5432/mars_it_school_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Paketlardagi zaifliklar (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Testlar
        run: npm test

      - name: Build
        run: npm run build

  # Deploy skriptlari bajarilishi shart. Git rejimi — yagona manba: serverda
  # `git reset --hard` har deploy'da qo'lda qo'yilgan huquqni qaytarib oladi.
  # Birinchi push-deploy aynan shu sababdan yiqilgandi (126: Permission denied).
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bajarish huquqi va sintaksis
        run: |
          fail=0
          for f in deploy/*.sh; do
            if [ ! -x "$f" ]; then
              echo "$f — bajarish huquqi yo'q (git update-index --chmod=+x $f)"
              fail=1
            fi
            bash -n "$f" || fail=1
          done
          exit $fail
